<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calvin Stahoviak - Interactive Resume</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: #fff;
        }
        #webglCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="webglCanvas"></canvas>

    <!-- Use an alternative CDN or local version of three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>

    <script>
        // Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // Explicitly set background color
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webglCanvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        console.log('Renderer initialized:', renderer);
        console.log('Camera position:', camera.position);

        // Pillar Geometry
        const pillarGeometry = new THREE.BoxGeometry(4, 12, 2);
        const pillarMaterials = [];
        const faceTexts = [
            "Calvin J. Stahoviak\nMaster's student specializing in autonomous robotics, AI, and ROS.",
            "Education:\nUniversity of New Mexico\nMaster's in Computer Science, GPA 3.83", 
            "Experience:\nSandia National Labs - R&D Intern\nDeveloped algorithms for gesture recognition and object manipulation.",
            "Skills:\nC++, Python, ROS, Machine Learning, SLAM, MATLAB, OpenCV"
        ];

        faceTexts.forEach((text, i) => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            console.log(`2D context for face ${i} initialized:`, ctx);
            ctx.fillStyle = '#3333ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.wrapText = function (text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                for (let n = 0; n < words.length; n++) {
                    const testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    const testWidth = metrics.width;
                    if (testWidth > maxWidth && n > 0) {
                        ctx.fillText(line, x, y);
                        line = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, y);
            };
            ctx.wrapText(text, canvas.width / 2, canvas.height / 4, 400, 30);
            console.log(`Text rendered for face ${i}:`, text);
            pillarMaterials.push(new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) }));
        });

        const pillar = new THREE.Mesh(pillarGeometry, pillarMaterials);
        scene.add(pillar);
        camera.position.z = 15;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        // Scroll-Based Rotation
        let scrollPosition = 0;
        window.addEventListener('wheel', (event) => {
            scrollPosition += event.deltaY * 0.005;
        });

        function animate() {
            requestAnimationFrame(animate);
            pillar.rotation.y = scrollPosition;
            console.log('Pillar rotation:', pillar.rotation.y);
            renderer.render(scene, camera);
        }

        animate();

        // Window Resize Handling
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
